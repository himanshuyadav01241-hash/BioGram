<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Himanshu Rao — BioGram</title>
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/lucide:sparkles.svg?color=%236366f1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Reset & Base Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
      padding: 1.5rem;
    }

    /* Dynamic Background Blur Layer */
    #profile-bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background-size: cover;
      background-position: center;
      filter: blur(8px) brightness(0.6);
    }

    /* Main Glass Card */
    .profile-card-container {
      width: 100%;
      max-width: 400px;
      padding: 2.25rem 1.75rem;
      border-radius: 28px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(99, 102, 241, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Avatar & Status Indicator */
    .avatar-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 1.25rem;
    }

    .avatar-img {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      background: #1e293b;
    }

    /* Profile Header Info */
    .profile-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .profile-handle {
      font-size: 0.875rem;
      color: #818cf8;
      margin: 0.2rem 0 0.75rem 0;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .profile-bio {
      font-size: 0.875rem;
      color: rgba(226, 232, 240, 0.8);
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    /* Clock Widget */
    .clock-container {
      background: rgba(2, 6, 23, 0.4);
      padding: 0.85rem 1rem;
      border-radius: 16px;
      margin-bottom: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .clock-time {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.05em;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    .clock-date {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 500;
      margin-top: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Upgraded Discord Widget */
    .discord-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(88, 101, 242, 0.1);
      border: 1px solid rgba(88, 101, 242, 0.25);
      padding: 0.85rem 1.1rem;
      border-radius: 18px;
      margin-bottom: 1.25rem;
      text-align: left;
      transition: all 0.25 ease;
    }

    .discord-card:hover {
      background: rgba(88, 101, 242, 0.16);
      border-color: rgba(88, 101, 242, 0.4);
    }

    .discord-icon-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .discord-brand-svg {
      width: 28px;
      height: 28px;
      fill: #5865F2;
    }

    .status-dot-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid #0f172a;
    }

    .status-dot-badge.online { background-color: #23a55a; box-shadow: 0 0 8px #23a55a; }
    .status-dot-badge.idle { background-color: #f0b232; box-shadow: 0 0 8px #f0b232; }
    .status-dot-badge.dnd { background-color: #f23f43; box-shadow: 0 0 8px #f23f43; }
    .status-dot-badge.offline { background-color: #80848e; }

    .discord-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .discord-user-name {
      font-weight: 700;
      font-size: 0.875rem;
      color: #ffffff;
    }

    .discord-activity-text {
      font-size: 0.8rem;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* Links Stack */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    .custom-profile-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.9rem 1.25rem;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.925rem;
      box-sizing: border-box;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .custom-profile-link:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(129, 140, 248, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.25);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Dynamic Background Layer -->
  <div id="profile-bg-layer"></div>

  <!-- Profile Card Container -->
  <main id="profile-card" class="profile-card-container">
    
    <!-- Avatar -->
    <div class="avatar-wrapper">
      <img id="profile-avatar" class="avatar-img" src="https://api.iconify.design/lucide:user.svg?color=%23ffffff" alt="Avatar" />
    </div>

    <!-- Identity -->
    <h1 id="profile-display-name" class="profile-name">Himanshu Rao</h1>
    <p id="profile-username" class="profile-handle">@himanshu</p>
    <p id="profile-bio" class="profile-bio">abc</p>

    <!-- Clock Widget -->
    <div id="profile-clock-widget" class="clock-container hidden">
      <div id="clock-time" class="clock-time">--:--:--</div>
      <div id="clock-date" class="clock-date">----</div>
    </div>

    <!-- Discord Status Widget -->
    <div id="discord-widget" class="discord-card hidden">
      <div class="discord-icon-wrapper">
        <svg class="discord-brand-svg" viewBox="0 0 127.14 96.36">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0,3.36,6.83A97.68,97.68,0,0,0,42.3,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.68,1.75,1.36,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53S36,40.3,42.45,40.3C48.92,40.3,54,46,53.87,53,53.87,60,48.92,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.08-12.7,11.44-12.7C91.16,40.3,96.28,46,96.15,53,96.15,60,91.16,65.69,84.69,65.69Z"/>
        </svg>
        <div id="discord-dot" class="status-dot-badge dnd"></div>
      </div>
      <div class="discord-info">
        <span id="discord-user" class="discord-user-name">insanehr1241</span>
        <span id="discord-activity" class="discord-activity-text">Playing Visual Studio Code</span>
      </div>
    </div>

    <!-- Social Links List -->
    <div id="profile-links-list" class="links-container"></div>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
